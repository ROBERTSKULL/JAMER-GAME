<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAMBER GAME</title>
<style>
body {
  margin:0;
  font-family: 'Comic Sans MS', 'Arial', sans-serif;
  background: linear-gradient(135deg,#ffb347,#ffcc33);
  color:#333;
}
header {
  display:flex;
  align-items:center;
  padding:20px;
  background:#ff6f61;
  color:white;
  font-size:2rem;
  font-weight:bold;
}
header img {
  width:50px;
  height:50px;
  margin-left:15px;
}
.section {
  padding:20px;
}
input, button, select {
  font-size:1rem;
  padding:8px;
  border-radius:6px;
  border:none;
  margin:5px 0;
}
button {
  cursor:pointer;
  background:#ff6f61;
  color:white;
  font-weight:bold;
}
button:hover { background:#ff856f; }
#scoresTable {
  position:fixed;
  right:0;
  top:80px;
  background:rgba(255,255,255,0.9);
  padding:10px;
  border-radius:8px;
}
#songList {
  margin-top:10px;
}
.songItem {
  margin-bottom:5px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:white;
  padding:5px 10px;
  border-radius:5px;
}
.songItem button {
  background:#ff856f;
  padding:2px 5px;
  font-size:0.8rem;
}
#playerContainer iframe {
  width:100%;
  height:360px;
  margin-top:10px;
}
.voteSection {
  margin-top:20px;
  padding:10px;
  background:#ffe1b3;
  border-radius:10px;
}
.voteSection button {
  margin:5px;
}
</style>
</head>
<body>

<header>
  JAMBER GAME
  <img src="https://cdn-icons-png.flaticon.com/512/179/179391.png" alt="Tocadiscos">
</header>

<div class="section" id="numPlayersSection">
  <h2>¿Cuántos jugadores? (mínimo 4)</h2>
  <input type="number" id="numPlayersInput" min="4" value="4">
  <button id="startGameBtn">¡Empezar!</button>
</div>

<div class="section" id="songsSection" style="display:none;">
  <h3 id="currentPlayerLabel"></h3>
  <input type="text" id="songInput" placeholder="Pega link de YouTube">
  <button id="addSongBtn">Añadir canción</button>
  <div id="songList"></div>
  <button id="nextPlayerBtn">Listo / Siguiente jugador</button>
</div>

<div id="playerContainer" class="section"></div>

<div class="section voteSection" id="voteSection" style="display:none;">
  <h3 id="votePrompt"></h3>
  <div id="voteButtons"></div>
  <button id="nextSongBtn">Siguiente canción</button>
</div>

<table id="scoresTable">
  <thead><tr><th>Jugador</th><th>Puntos</th></tr></thead>
  <tbody id="scoresBody"></tbody>
</table>

<script>
let numPlayers=0;
let players=[];
let scores={};
let currentPlayerIndex=0;
let maxSongsPerPlayer=0;
let allSongs=[]; // {title, url, owner}
let currentSongIndex=0;

const numPlayersInput = document.getElementById('numPlayersInput');
const startGameBtn = document.getElementById('startGameBtn');
const songsSection = document.getElementById('songsSection');
const currentPlayerLabel = document.getElementById('currentPlayerLabel');
const songInput = document.getElementById('songInput');
const addSongBtn = document.getElementById('addSongBtn');
const songList = document.getElementById('songList');
const nextPlayerBtn = document.getElementById('nextPlayerBtn');
const playerContainer = document.getElementById('playerContainer');

const voteSection = document.getElementById('voteSection');
const votePrompt = document.getElementById('votePrompt');
const voteButtons = document.getElementById('voteButtons');
const nextSongBtn = document.getElementById('nextSongBtn');

const scoresBody = document.getElementById('scoresBody');

function renderScores(){
  scoresBody.innerHTML='';
  players.forEach(p=>{
    const tr=document.createElement('tr');
    const tdName=document.createElement('td'); tdName.textContent=p;
    const tdScore=document.createElement('td'); tdScore.textContent=scores[p];
    tr.appendChild(tdName); tr.appendChild(tdScore);
    scoresBody.appendChild(tr);
  });
}

function updatePlayerLabel(){
  currentPlayerLabel.textContent=`Turno de ${players[currentPlayerIndex]} (${allSongs.filter(s=>s.owner===players[currentPlayerIndex]).length+1}/${maxSongsPerPlayer})`;
}

startGameBtn.onclick = ()=>{
  numPlayers = parseInt(numPlayersInput.value);
  if(numPlayers<4){ alert('Mínimo 4 jugadores'); return; }
  maxSongsPerPlayer=numPlayers;
  players=[]; scores={};
  for(let i=1;i<=numPlayers;i++){
    let name='';
    while(!name){ name=prompt(`Nombre del jugador ${i}:`); if(!name) alert('Debes poner un nombre válido'); }
    players.push(name); scores[name]=0;
  }
  document.getElementById('numPlayersSection').style.display='none';
  songsSection.style.display='block';
  updatePlayerLabel();
  renderScores();
};

addSongBtn.onclick = async ()=>{
  if(!songInput.value) return;
  if(allSongs.filter(s=>s.owner===players[currentPlayerIndex]).length>=maxSongsPerPlayer){
    alert(`Solo puedes añadir ${maxSongsPerPlayer} canciones`);
    songInput.value=''; return;
  }
  const url = songInput.value.trim();
  const videoIdMatch = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(!videoIdMatch){ alert('URL de YouTube no válida'); return; }
  const videoId = videoIdMatch[1];
  const apiURL=`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`;
  try{
    const res = await fetch(apiURL);
    const data = await res.json();
    const title = data.title || 'Canción';
    allSongs.push({title,url,owner:players[currentPlayerIndex]});
    renderSongList();
    songInput.value='';
  }catch(e){ alert('Error al obtener título'); }
};

function renderSongList(){
  songList.innerHTML='';
  allSongs.filter(s=>s.owner===players[currentPlayerIndex]).forEach((s,i)=>{
    const div=document.createElement('div'); div.className='songItem';
    div.textContent=`${i+1}. ${s.title}`;
    const delBtn=document.createElement('button'); delBtn.textContent='Eliminar';
    delBtn.onclick=()=>{ allSongs.splice(allSongs.indexOf(s),1); renderSongList(); updatePlayerLabel(); };
    div.appendChild(delBtn);
    songList.appendChild(div);
  });
  updatePlayerLabel();
}

nextPlayerBtn.onclick = ()=>{
  if(allSongs.filter(s=>s.owner===players[currentPlayerIndex]).length<maxSongsPerPlayer){
    alert('Debes añadir todas tus canciones'); return;
  }
  currentPlayerIndex++;
  if(currentPlayerIndex>=players.length){
    songsSection.style.display='none';
    startSongRound();
  }else{
    renderSongList();
    updatePlayerLabel();
  }
};

function startSongRound(){
  currentSongIndex=0;
  shuffleArray(allSongs);
  showCurrentSong();
}

function showCurrentSong(){
  voteSection.style.display='none';
  playerContainer.innerHTML=`<iframe src="https://www.youtube.com/embed/${getVideoId(allSongs[currentSongIndex].url)}?autoplay=1&controls=0" allow="autoplay" frameborder="0"></iframe>`;
  setTimeout(()=>{ startVoting(); },15000); // 15s por canción
}

function startVoting(){
  voteSection.style.display='block';
  votePrompt.textContent=`¿Quién puso esta canción?`;
  voteButtons.innerHTML='';
  players.filter(p=>p!==allSongs[currentSongIndex].owner).forEach(p=>{
    const btn=document.createElement('button');
    btn.textContent=p;
    btn.onclick=()=>{ 
      if(p===allSongs[currentSongIndex].owner){
        alert('No puedes votar por ti mismo');
        return;
      }
      // Puntos
      if(p === allSongs[currentSongIndex].owner) return;
      if(!allSongs[currentSongIndex].votes) allSongs[currentSongIndex].votes={};
      allSongs[currentSongIndex].votes[p]=true;
      if(p===allSongs[currentSongIndex].owner){
        scores[p]+=2;
      } else {
        scores[allSongs[currentSongIndex].owner]-=1;
      }
      renderScores();
      voteSection.style.display='none';
      currentSongIndex++;
      if(currentSongIndex<allSongs.length){
        showCurrentSong();
      } else {
        alert('¡Ronda terminada!');
        playerContainer.innerHTML='';
      }
    };
    voteButtons.appendChild(btn);
  });
}

function getVideoId(url){
  const m = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m?m[1]:'';
}

function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
}
</script>

</body>
</html>
