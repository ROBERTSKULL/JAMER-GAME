<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAMBER GAME</title>
<style>
body {
    margin: 0; font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg, #ffcc80, #ff7043);
    color: #fff;
}
h1, h2 { text-align: center; margin: 0.5em 0; }
h1 { font-size: 3em; color: #fff3e0; }
button { cursor: pointer; }
#menu {
    position: fixed; top:0; left:0; width:220px; height:100%;
    background:#ffab91; padding:16px; box-sizing:border-box;
}
#menu h3 { margin-top:0; }
#main { margin-left: 240px; padding: 16px; }
input { font-size:1.2em; padding:8px; border-radius:6px; border:none; }
.playerList { margin-top:8px; list-style:none; padding:0; color:#000; background:#ffe0b2; border-radius:6px; }
.playerList li { margin:4px 0; padding:4px 8px; background:#fff3e0; border-radius:4px; }
.scoreTable { margin-top:16px; border-collapse:collapse; width:100%; }
.scoreTable th, .scoreTable td { border:1px solid #fff3e0; padding:8px; text-align:center; font-size:1.1em; }
#youtubePlayer { width: 100%; height: 360px; margin:16px 0; border-radius:8px; }
</style>
</head>
<body>

<div id="menu">
<h3>Menú</h3>
<button onclick="restartGame()">Volver a empezar</button><br><br>
<button onclick="editNames()">Editar nombres de jugadores</button><br><br>
<button onclick="showHelp()">Ayuda</button><br><br>
<button onclick="showRules()">Normas</button>
</div>

<div id="main">

<h1>🎵 JAMBER GAME 🎵</h1>

<div id="playerCountSelect">
    <p>Selecciona cantidad de jugadores (mínimo 4)</p>
    <input type="number" id="numPlayers" min="4" value="4">
    <button onclick="setNumPlayers()">Confirmar</button>
</div>

<div id="playerSetup" style="display:none;">
    <p>Introduce el nombre del jugador y pulsa Enter o “Siguiente”</p>
    <input id="playerNameInput" type="text" placeholder="Nombre del jugador">
    <button id="nextPlayerBtn">Siguiente</button>
    <p id="playerCount"></p>
</div>

<div id="songSelection" style="display:none;">
    <h2 id="songPlayerTitle"></h2>
    <input type="text" id="songUrl" placeholder="Pega link de YouTube (menos de 3 min)">
    <button onclick="addSong()">Añadir canción</button>
    <ul id="currentPlayerSongs" class="playerList"></ul>
    <button onclick="nextPlayerSongs()">Listo</button>
</div>

<div id="gamePhase" style="display:none;">
    <h2 id="currentTurn"></h2>
    <div id="youtubePlayer"></div>
    <p id="guessPrompt"></p>
    <div id="guessButtons"></div>
    <table class="scoreTable" id="scoreTable">
        <thead><tr><th>Jugador</th><th>Puntos</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
let totalPlayers = 0;
let currentPlayer = 0;
let players = [];
let playerSongs = [];
let currentSongIndex = 0;
let songsQueue = [];
let scores = {};

function setNumPlayers(){
    const num = parseInt(document.getElementById('numPlayers').value);
    if(num < 4) { alert("Mínimo 4 jugadores"); return; }
    totalPlayers = num;
    document.getElementById('playerCountSelect').style.display='none';
    document.getElementById('playerSetup').style.display='block';
    updatePlayerCountDisplay();
}

function updatePlayerCountDisplay(){
    document.getElementById('playerCount').textContent = `Jugador ${currentPlayer+1} de ${totalPlayers}`;
}

const playerInput = document.getElementById('playerNameInput');
const nextBtn = document.getElementById('nextPlayerBtn');

function addPlayerName(){
    const name = playerInput.value.trim();
    if(!name) return alert("Escribe un nombre válido");
    players.push(name);
    scores[name]=0;
    playerSongs.push([]);
    currentPlayer++;
    playerInput.value='';
    if(currentPlayer >= totalPlayers){
        document.getElementById('playerSetup').style.display='none';
        currentPlayer=0;
        startSongSelectionPhase();
    } else updatePlayerCountDisplay();
}

playerInput.addEventListener('keydown', e => { if(e.key==='Enter') addPlayerName(); });
nextBtn.addEventListener('click', addPlayerName);

function startSongSelectionPhase(){
    document.getElementById('songSelection').style.display='block';
    updateSongPlayerTitle();
}

function updateSongPlayerTitle(){
    document.getElementById('songPlayerTitle').textContent = `Turno de ${players[currentPlayer]}: añade ${totalPlayers} canciones`;
    renderCurrentPlayerSongs();
}

function renderCurrentPlayerSongs(){
    const ul = document.getElementById('currentPlayerSongs');
    ul.innerHTML='';
    playerSongs[currentPlayer].forEach((s,i)=>{
        const li = document.createElement('li');
        li.textContent = `${i+1}. ${s.title}`;
        const delBtn = document.createElement('button');
        delBtn.textContent='❌';
        delBtn.style.marginLeft='8px';
        delBtn.onclick = ()=>{ playerSongs[currentPlayer].splice(i,1); renderCurrentPlayerSongs(); };
        li.appendChild(delBtn);
        ul.appendChild(li);
    });
}

function addSong(){
    const url = document.getElementById('songUrl').value.trim();
    if(!url) return;
    // Extraemos el título de YouTube desde la URL (simplificado)
    const videoId = url.split("v=")[1]?.split("&")[0];
    if(!videoId) return alert("Link inválido");
    fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`)
    .then(r=>r.json()).then(data=>{
        if(!data.title) return alert("No se pudo obtener título o video no disponible");
        if(playerSongs[currentPlayer].length >= totalPlayers) return alert(`Ya añadiste ${totalPlayers} canciones`);
        playerSongs[currentPlayer].push({url, title:data.title, owner:players[currentPlayer]});
        renderCurrentPlayerSongs();
        document.getElementById('songUrl').value='';
    });
}

function nextPlayerSongs(){
    if(playerSongs[currentPlayer].length < totalPlayers){
        return alert(`Debes añadir ${totalPlayers} canciones`);
    }
    currentPlayer++;
    if(currentPlayer >= totalPlayers){
        document.getElementById('songSelection').style.display='none';
        startGamePhase();
    } else updateSongPlayerTitle();
}

function startGamePhase(){
    // Mezclamos todas las canciones
    songsQueue = [].concat(...playerSongs);
    songsQueue = songsQueue.sort(()=>Math.random()-0.5);
    currentPlayer=0;
    currentSongIndex=0;
    document.getElementById('gamePhase').style.display='block';
    renderScoreTable();
    playNextSong();
}

function playNextSong(){
    if(currentSongIndex >= songsQueue.length){
        alert("Juego terminado");
        return;
    }
    const song = songsQueue[currentSongIndex];
    document.getElementById('currentTurn').textContent = `Escucha la canción: ${song.title}`;
    document.getElementById('youtubePlayer').innerHTML = `<iframe width="100%" height="360" src="https://www.youtube.com/embed/${song.url.split("v=")[1]}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    setupGuessPhase();
}

function setupGuessPhase(){
    const song = songsQueue[currentSongIndex];
    let guessDiv = document.getElementById('guessButtons');
    guessDiv.innerHTML='';
    document.getElementById('guessPrompt').textContent = `${players[currentPlayer]}: ¿Quién puso esta canción?`;
    players.forEach((p,i)=>{
        if(p===song.owner) return; // No puede adivinarse a sí mismo
        const btn = document.createElement('button');
        btn.textContent = p;
        btn.style.margin='4px';
        btn.onclick = ()=>{
            if(p === song.owner) { scores[song.owner]+= -1; scores[players[currentPlayer]]+=2; } else { scores[song.owner]-=0; scores[players[currentPlayer]]+=0; } 
            currentPlayer++;
            if(currentPlayer >= players.length){
                currentPlayer=0;
                currentSongIndex++;
            }
            renderScoreTable();
            playNextSong();
        };
        guessDiv.appendChild(btn);
    });
}

function renderScoreTable(){
    const tbody = document.getElementById('scoreTable').querySelector('tbody');
    tbody.innerHTML='';
    players.forEach(p=>{
        const tr = document.createElement('tr');
        const tdName = document.createElement('td'); tdName.textContent=p;
        const tdScore = document.createElement('td'); tdScore.textContent=scores[p];
        tr.appendChild(tdName); tr.appendChild(tdScore);
        tbody.appendChild(tr);
    });
}

function restartGame(){ location.reload(); }
function editNames(){ alert("Función para editar nombres aún en desarrollo"); }
function showHelp(){ alert("Lo siento, esta página está en desarrollo. Si necesitas ayuda ve a preguntar a tu amig@ ChatGPT"); }
function showRules(){ alert("Normas: Cada jugador selecciona N canciones (N=total jugadores), luego se reproducen aleatoriamente, los demás adivinan quién las eligió. Puntos: +2 por acertar, -1 al propietario si aciertan."); }

</script>

</body>
</html>
